[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-kr"
version = "0.1.0"
description = "Kiro Social Device Flow, AWS Builder ID OIDC client, WAF-free GitHub OAuth URL rewriter, and StyxRouter/OmniRoute installer."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auto-kr = "auto_kr.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
